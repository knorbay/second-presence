name: Desktop release packages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows
          - os: ubuntu-22.04
            platform: Linux
    runs-on: ${{ matrix.os }}
    env:
      PYGAME_HIDE_SUPPORT_PROMPT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libxkbcommon0 libegl1 libgl1
      - run: python -m pip install -r packaging/requirements-build.txt
      - name: Test gameplay
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python -m unittest discover -s tests
      - name: Build native application
        run: python -m PyInstaller --noconfirm packaging/desktop.spec
      - name: Verify extracted download
        run: python packaging/package_desktop.py
      - uses: actions/upload-artifact@v4
        with:
          name: Second-Presence-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            dist/Second-Presence-*.zip
            dist/Second-Presence-*.tar.gz
            dist/*-verification.json
